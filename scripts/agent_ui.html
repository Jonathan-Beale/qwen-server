<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6f6e69; --line: #dedcd5;
    --accent: #2f6f5e; --accent-text: #ffffff; --user: #e7efe9; --code: #f0eee8;
    --warn: #9a5b00; --bad: #b3261e; --good: #2f7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2124; --text: #e6e4df; --muted: #9a9892; --line: #33363a;
      --accent: #6fbfa6; --accent-text: #10201b; --user: #24302c; --code: #17181a;
      --warn: #e0a84a; --bad: #f08a80; --good: #7fcf9c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column;
         font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  code, pre, textarea.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 13px; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  #status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--good); } .dot.bad { background: var(--bad); }
  #workspace { flex: 1 1 200px; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  #workspace b { color: var(--text); font-weight: 500; }

  #banner { padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
            color: var(--bad); font-size: 13px; white-space: pre-wrap; }
  main { flex: 1; overflow-y: auto; padding: 20px 16px; }
  #log { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  #empty { color: var(--muted); text-align: center; margin-top: 12vh; }

  .user { align-self: flex-end; max-width: 85%; background: var(--user); border-radius: 12px;
          padding: 8px 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .assistant { white-space: pre-wrap; overflow-wrap: anywhere; }
  .assistant pre { background: var(--code); border: 1px solid var(--line); border-radius: 6px;
                   padding: 10px 12px; overflow-x: auto; margin: 6px 0; }
  .assistant :not(pre) > code { background: var(--code); border-radius: 4px; padding: 1px 5px; }
  .assistant .h { font-weight: 650; font-size: 16px; }
  a { color: var(--accent); }
  details { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  summary { cursor: pointer; padding: 6px 12px; color: var(--muted); font-size: 13px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  summary b { color: var(--text); font-weight: 600; }
  details pre { margin: 0; padding: 8px 12px; border-top: 1px solid var(--line); white-space: pre-wrap;
                overflow-wrap: anywhere; max-height: 340px; overflow-y: auto; }
  .think pre { color: var(--muted); font-family: inherit; font-size: 13px; }
  .tool .label { padding: 4px 12px 0; color: var(--muted); font-size: 12px; }
  .approve { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px;
             border-top: 1px solid var(--line); color: var(--warn); font-size: 13px; }
  .tool.declined summary b, .tool.failed summary b { color: var(--bad); }
  .note { color: var(--muted); font-size: 13px; text-align: center; }
  .note.error { color: var(--bad); white-space: pre-wrap; }

  footer { background: var(--panel); border-top: 1px solid var(--line); padding: 12px 16px; }
  #composer { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #input { flex: 1; resize: none; max-height: 220px; font: inherit; color: var(--text); background: var(--bg);
           border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
  #input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
</style>
</head>
<body>
<header>
  <h1>Qwen</h1>
  <div id="status"><span class="dot" id="dot"></span><span id="statusText">Connecting</span></div>
  <div id="workspace"></div>
  <button id="changeWs" title="Choose the folder the assistant can read and edit">Change folder</button>
  <button id="newChat">New chat</button>
  <button id="quit" title="Stop the agent and its connection to the server">Quit</button>
</header>
<div id="banner" hidden></div>
<main id="scroll"><div id="log"><div id="empty">Ask a question, or ask for a change in the workspace folder.</div></div></main>
<footer>
  <div id="composer">
    <textarea id="input" rows="1" placeholder="Message (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
    <button id="send" class="primary">Send</button>
    <button id="stop" hidden>Stop</button>
  </div>
</footer>

<script>
const token = new URLSearchParams(location.search).get("token") || "";
const $ = id => document.getElementById(id);
const log = $("log"), scroller = $("scroll"), input = $("input");
let current = null;   // assistant block being streamed: {think, thinkText, body, raw}
let tools = {};       // tool call id -> card element
let busy = false;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

// Minimal markdown: fenced code, inline code, bold, headings, links. Everything is escaped first.
function inline(text) {
  return esc(text)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>')
    .replace(/^#{1,6} +(.*)$/gm, '<span class="h">$1</span>');
}
function markdown(src) {
  return src.split(/```/).map((part, i) => {
    if (i % 2 === 0) return inline(part);
    return "<pre><code>" + esc(part.replace(/^[^\n]*\n/, "")) + "</code></pre>";
  }).join("");
}

function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 120; }
function append(node) {
  const stick = nearBottom();
  $("empty")?.remove();
  log.appendChild(node);
  if (stick) scroller.scrollTop = scroller.scrollHeight;
  return node;
}
function keepScrolled(fn) { const stick = nearBottom(); fn(); if (stick) scroller.scrollTop = scroller.scrollHeight; }
function note(text, cls) { append(el("div", "note" + (cls ? " " + cls : ""), text)); }

function block() {
  if (!current) current = {think: null, thinkText: null, body: null, raw: ""};
  return current;
}
function summarize(name, args) {
  const key = {run_command: "command", web_search: "query", fetch_url: "url", search_files: "pattern"}[name] || "path";
  const value = args[key] !== undefined ? args[key] : Object.values(args).find(v => typeof v === "string");
  return value === undefined ? "" : String(value).split("\n")[0];
}

const handlers = {
  reset(e) {
    log.innerHTML = '<div id="empty">Ask a question, or ask for a change in the workspace folder.</div>';
    current = null; tools = {}; setBusy(false);
    $("workspace").innerHTML = "Folder: <b></b> on " + esc(e.host);
    $("workspace").querySelector("b").textContent = e.workspace;
    $("workspace").title = e.workspace;
    document.title = "Qwen: " + e.workspace.split(/[\\/]/).pop();
  },
  user(e) { current = null; append(el("div", "user", e.text)); scroller.scrollTop = scroller.scrollHeight; },
  reasoning(e) {
    const b = block();
    if (!b.think) {
      b.think = append(el("details", "think"));
      b.think.appendChild(el("summary", "", "Thinking"));
      b.thinkText = b.think.appendChild(el("pre"));
    }
    keepScrolled(() => b.thinkText.textContent += e.text);
  },
  content(e) {
    const b = block();
    if (!b.body) b.body = append(el("div", "assistant"));
    b.raw += e.text;
    keepScrolled(() => b.body.innerHTML = markdown(b.raw.trim()));
  },
  message_end() { current = null; },
  tool_call(e) {
    current = null;
    const card = append(el("details", "tool"));
    const summary = card.appendChild(el("summary"));
    summary.appendChild(el("b", "", e.name));
    summary.appendChild(document.createTextNode(" " + summarize(e.name, e.args)));
    card.appendChild(el("div", "label", "Input"));
    card.appendChild(el("pre", "", JSON.stringify(e.args, null, 2)));
    tools[e.id] = card;
  },
  approval(e) {
    const card = tools[e.id];
    if (!card) return;
    card.open = true;
    const bar = el("div", "approve");
    bar.appendChild(el("span", "", "Allow this?"));
    for (const [label, decision] of [["Allow", "yes"], ["Deny", "no"], ["Always allow", "always"]]) {
      const btn = el("button", decision === "yes" ? "primary" : "", label);
      btn.onclick = () => post("/api/approve", {id: e.id, decision});
      bar.appendChild(btn);
    }
    card.insertBefore(bar, card.children[1]);
    scroller.scrollTop = scroller.scrollHeight;
  },
  approval_done(e) {
    const card = tools[e.id];
    if (!card) return;
    card.querySelector(".approve")?.remove();
    card.open = false;
    if (e.decision === "no") card.classList.add("declined");
  },
  tool_result(e) {
    const card = tools[e.id];
    if (!card) return;
    if (e.text.startsWith("Error:")) card.classList.add("failed");
    card.appendChild(el("div", "label", "Output"));
    card.appendChild(el("pre", "", e.text));
  },
  notice(e) { note(e.text); },
  error(e) { note(e.text, "error"); refreshStatus(); },
  busy(e) { setBusy(e.value); },
};

function setBusy(value) {
  busy = value;
  $("send").hidden = value; $("stop").hidden = !value;
  $("newChat").disabled = $("changeWs").disabled = value;
}

async function post(path, body) {
  const res = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Token": token},
                                 body: JSON.stringify(body || {})});
  const data = await res.json().catch(() => ({}));
  if (!res.ok && data.error) note(data.error, "error");
  return res.ok;
}

function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = ""; input.style.height = "auto";
  post("/api/send", {text});
}

async function refreshStatus() {
  let s;
  try { s = await (await fetch("/api/status?token=" + encodeURIComponent(token))).json(); }
  catch { s = null; }
  const dot = $("dot"), text = $("statusText"), banner = $("banner");
  if (!s) { dot.className = "dot bad"; text.textContent = "Agent stopped"; banner.hidden = true; return; }
  dot.className = "dot " + (s.model ? "ok" : "bad");
  text.textContent = s.model ? (s.search ? "Connected" : "Connected, web search offline") : "Model server unreachable";
  const problem = s.model ? "" : (s.tunnel_error
    || (s.ssh ? "The SSH tunnel to " + s.ssh + " is open but the model server is not answering. Is it running?"
              : "Nothing is answering on the model server port. On the server, start it with ./vllm-server.sh start. "
                + "On another machine, run this once so it knows where the server is: python agent.py --ssh user@server"));
  banner.textContent = problem; banner.hidden = !problem;
}

$("send").onclick = send;
$("stop").onclick = () => post("/api/stop");
$("newChat").onclick = () => post("/api/clear");
$("changeWs").onclick = async () => {
  const path = window.prompt("Folder the assistant can read and edit (starts a new chat):", $("workspace").title);
  if (path) await post("/api/workspace", {path});
};
$("quit").onclick = async () => {
  await post("/api/quit");
  document.body.innerHTML = '<div id="empty">The agent has stopped. You can close this tab.</div>';
};
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight + 2, 220) + "px";
});

const source = new EventSource("/api/events?token=" + encodeURIComponent(token));
source.onmessage = e => { const ev = JSON.parse(e.data); handlers[ev.type]?.(ev); };
source.onerror = refreshStatus;
refreshStatus();
setInterval(refreshStatus, 20000);
</script>
</body>
</html>
