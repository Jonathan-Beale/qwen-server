# vLLM Server
#
# Model:   Qwen3.8-27B (INT8 weights, built-in MTP speculative decoding)
# GPUs:    2x RTX 3090, tensor-parallel
# Context: 262144 tokens, one request at a time
# Search:  SearXNG on 127.0.0.1:8888 (backend for scripts/agent.py)
#
# To start:   ./vllm-server.sh start
# To stop:    ./vllm-server.sh stop
# To restart: ./vllm-server.sh restart

services:
  vllm-server:
    image: vllm/vllm-openai:v0.31.0
    command:
      - --model
      - /models/Qwen3.8-27B-INT8-W8A16-MTP
      - --served-model-name
      - qwen
      - --tensor-parallel-size
      - '2'
      - --dtype
      - bfloat16
      - --max-model-len
      - '262144'
      - --gpu-memory-utilization
      - '0.92'
      # Concurrent requests can crash the engine with MTP on this model
      # (vllm-project/vllm#50021, still open). Keep at 1 until that ships.
      - --max-num-seqs
      - '1'
      - --max-num-batched-tokens
      - '8192'
      - --kv-cache-dtype
      - fp8_e4m3
      # The 3090s have no NVLink/P2P; all-reduce must go through NCCL.
      - --disable-custom-all-reduce
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - ./models:/models
    environment:
      - HF_HOME=/models/.cache
      - HF_HUB_OFFLINE=1
      - NCCL_P2P_DISABLE=1
      - NCCL_CUMEM_ENABLE=0
      - OMP_NUM_THREADS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    ipc: host
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - production

  searxng:
    image: searxng/searxng:latest
    ports:
      - 127.0.0.1:8888:8080
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      # Only signs local URLs; the instance is bound to localhost.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-qwen-server-local-only}
    restart: unless-stopped
    profiles:
      - production

  # Legacy: LoRA training for the previous Qwen2-7B setup (see TRAINING_README.md).
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.training
    working_dir: /workspace
    volumes:
      - ./models:/models
      - ./training-data:/training-data
      - ./lora-adapters:/lora-adapters
      - ./training-scripts:/workspace
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TRANSFORMERS_CACHE=/models/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - training
