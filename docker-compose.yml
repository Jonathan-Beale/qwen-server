# vLLM Server
#
# Target:  Qwen2-7B-Instruct-AWQ (awq_marlin)
# Draft:   Qwen2.5-0.5B-vocab152064 (FP16, k=1)
# Throughput: ~91 tok/s (vs ~82 tok/s no spec decoding)
#
# To start:   ./vllm-server.sh start
# To stop:    ./vllm-server.sh stop
# To restart: ./vllm-server.sh restart

services:
  vllm-server:
    image: vllm/vllm-openai:v0.19.0-cu130
    command:
      - --model
      - /models/Qwen2-7B-Instruct-AWQ
      - --quantization
      - awq_marlin
      - --max-model-len
      - '8192'
      - --gpu-memory-utilization
      - '0.88'
      - --max-num-seqs
      - '1'
      - --max-num-batched-tokens
      - '8192'
      - --enable-lora
      - --lora-modules
      - dpo=/lora-adapters/current
      - --speculative-config
      - '{"model":"/models/Qwen2.5-0.5B-vocab152064-ft-dpo","num_speculative_tokens":1,"draft_tensor_parallel_size":1}'
    ports:
      - 8000:8000
    volumes:
      - ./models:/models
      - ./lora-adapters:/lora-adapters:ro
      - ./scripts:/workspace/scripts:ro
    environment:
      - HF_HOME=/models/.cache
      - TRANSFORMERS_CACHE=/models/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - production

  trainer:
    build:
      context: .
      dockerfile: Dockerfile.training
    working_dir: /workspace
    volumes:
      - ./models:/models
      - ./training-data:/training-data
      - ./lora-adapters:/lora-adapters
      - ./training-scripts:/workspace
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TRANSFORMERS_CACHE=/models/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - training
